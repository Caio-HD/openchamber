# Temporary: hand-built desktop previews of the OpenCode v2 branch for testers.
#
# Every run rebuilds the macOS apps from the chosen ref, stamps them as
# 2.0.0-preview.<run number>, and replaces the files on the `v2-preview`
# pre-release. A pre-release is never "latest", so the in-app updater and the
# website keep pointing at the stable release, while the preview app itself
# still runs its update check (that check is where install statistics come
# from) and never sees a stable 1.x as an upgrade, because 2.0.0-preview.* is
# newer than any 1.x. Delete this workflow and the `v2-preview` release once
# v2 ships.
name: v2 preview (desktop)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or sha)
        required: false
        default: opencode-v2-refactoring

permissions:
  contents: write

env:
  PREVIEW_TAG: v2-preview

jobs:
  prepare-release:
    name: Prepare v2-preview pre-release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve preview version
        id: version
        run: echo "version=2.0.0-preview.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create the pre-release when it does not exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $PREVIEW_TAG exists"
          else
            gh release create "$PREVIEW_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --target "$(git rev-parse HEAD)" \
              --title "OpenChamber v2 preview" \
              --notes "Test builds of OpenChamber on OpenCode v2. Not a release: files here are replaced on every build, and this build does not update itself to a stable version. Each file name carries the build number."
          fi

      - name: Update the pre-release notes with the build being published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REF: ${{ inputs.ref || github.ref }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short HEAD)
          gh release edit "$PREVIEW_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --notes "Test builds of OpenChamber on OpenCode v2. Not a release: files here are replaced on every build, and this build does not update itself to a stable version.

Current build: $VERSION from \`$REF\` ($sha), bundling OpenCode $(node -p "require('./packages/electron/package.json').opencodeCli.version")."

  build-macos:
    name: macOS ${{ matrix.arch }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stamp the preview version
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          for file in packages/electron/package.json packages/web/package.json; do
            node -e '
              const fs = require("fs");
              const [file, version] = process.argv.slice(1);
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              pkg.version = version;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
            ' "$file" "$VERSION"
          done
          node -p "require('./packages/electron/package.json').version"

      - name: Get bundled OpenCode CLI version
        id: opencode_cli_version
        run: |
          VERSION=$(node -p "require('./packages/electron/package.json').opencodeCli.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache bundled OpenCode CLI artifact
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-${{ matrix.arch }}-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install Apple Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/electron-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build Electron app
        working-directory: packages/electron
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ELECTRON_BUILDER_ARCH: ${{ matrix.arch }}
        run: |
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run bundle:main
          bun run rebuild:native
          bunx electron-builder --mac --${{ matrix.arch }} --publish=never
          bun run verify:opencode-cli:packaged

      - name: Verify signature and notarization
        run: |
          set -euo pipefail
          APP_DIR="packages/electron/dist/mac"
          [ -d "packages/electron/dist/mac-arm64" ] && APP_DIR="packages/electron/dist/mac-arm64"
          APP_PATH=$(find "$APP_DIR" -maxdepth 2 -name "*.app" -print -quit)
          [ -n "$APP_PATH" ] || { echo ".app not found"; ls -la packages/electron/dist/; exit 1; }
          codesign -vv --deep --strict "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: Replace this platform's files on the pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # Older builds carry other build numbers in their names, so --clobber
          # alone would leave them behind: drop every file for this arch first.
          for asset in $(gh release view "$PREVIEW_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
            case "$asset" in
              *-"$ARCH".dmg|*-mac-"$ARCH".zip)
                gh release delete-asset "$PREVIEW_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes ;;
            esac
          done
          files=()
          for file in packages/electron/dist/*.dmg packages/electron/dist/*.zip; do
            [ -f "$file" ] && files+=("$file")
          done
          gh release upload "$PREVIEW_TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
